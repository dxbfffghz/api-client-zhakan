<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pokémon API client — built with pure JavaScript, fetch and async/await.">
    <title>Pokémon API Client — Akerke Zhakan</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <header class="header">
      <div class="container">
        <h1>Pokémon API Client</h1>
        <p class="subtitle">Pure JavaScript · fetch · async/await · PokeAPI</p>
      </div>
    </header>

    <main class="container">

      <section class="card">
        <form id="search-form" class="search">
          <label for="search-input" class="visually-hidden">Search Pokémon</label>
          <input type="search" id="search-input" name="q" placeholder="Search Pokémon, e.g. pikachu" autocomplete="off">
          <button type="submit" class="btn">Search</button>
          <button type="button" id="reset-btn" class="btn btn--ghost">Reset</button>
        </form>
      </section>

      <section class="card">
        <h2>Quick facts</h2>
        <p class="hint">Two parallel requests with <code>Promise.all</code>: total Pokémon and total types.</p>
        <div id="parallel" class="parallel">
          <div class="parallel-item"><span class="label">Total Pokémon:</span> <span id="pop-country">—</span></div>
          <div class="parallel-item"><span class="label">Total types:</span> <span id="total-countries">—</span></div>
        </div>
      </section>

      <p id="loading" class="status" hidden>Loading…</p>
      <p id="error" class="status status--error" hidden></p>

      <section id="list" class="grid"></section>

      <section id="details" class="card details" hidden>
        <button type="button" id="close-details" class="btn btn--ghost">Close</button>
        <div id="details-content"></div>
      </section>

    </main>

    <footer class="footer">
      <div class="container">
        <p>© 2026 Akerke Zhakan · Lab 6 — API client</p>
      </div>
    </footer>

    <script type="module" src="src/app.js"></script>
  </body>

</html>
